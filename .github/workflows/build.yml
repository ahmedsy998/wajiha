name: build-apk
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: فك ضغط المشروع
        run: |
          unzip -q project.zip -d work
          ls work
      - name: مفتاح التوقيع
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: بناء APK
        working-directory: work/wajiha
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: نشر الملف
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: واجهتي - بناء ${{ github.run_number }}
          files: work/wajiha/app/build/outputs/apk/release/app-release.apk
